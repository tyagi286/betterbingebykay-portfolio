<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S2DR3FM008"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S2DR3FM008');
  </script>
  <title>Better Binge by Kay</title>

  <!-- Favicon set (generated from the logo via realfavicongenerator.net) -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Better Binge by Kay">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph / Twitter preview cards. These are static (crawlers
       don't run JS), so if you change displayName, tagline, logo, or the
       site URL in js/config.js, update the matching lines below too. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tyagi286.github.io/betterbingebykay-portfolio/">
  <meta property="og:title" content="Better Binge by Kay">
  <meta property="og:description" content="Handcrafted eggless brownie boxes & custom hampers — handcrafted with love.">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1Y21SFbOI-dYDAWjpSCwG2dLkExf7SiuU=w1200-h630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Better Binge by Kay">
  <meta name="twitter:description" content="Handcrafted eggless brownie boxes & custom hampers — handcrafted with love.">
  <meta name="twitter:image" content="https://lh3.googleusercontent.com/d/1Y21SFbOI-dYDAWjpSCwG2dLkExf7SiuU=w1200-h630">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ░░ HERO ░░ -->
  <div class="hero">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <span class="petal" style="left:10%;bottom:20%;animation-duration:11s;">🌸</span>
    <span class="petal" style="left:30%;bottom:10%;animation-duration:14s;animation-delay:-4s;">🌷</span>
    <span class="petal" style="left:60%;bottom:15%;animation-duration:9s;animation-delay:-7s;">🌸</span>
    <span class="petal" style="left:80%;bottom:25%;animation-duration:13s;animation-delay:-2s;">✿</span>
    <span class="petal" style="left:50%;bottom:5%;animation-duration:10s;animation-delay:-9s;">🌸</span>

    <div class="hero-inner">
      <div class="logo-wrap" id="logoWrap"></div>
      <h1 id="heroTitle"></h1>
      <div class="hero-divider"><span>✦</span></div>
      <p class="tagline" id="tagline"></p>
      <div class="handle-badge" id="handleBadge"></div>
      <p class="kay-note" id="kayNote"></p>
    </div>

    <div class="hero-wave">
      <svg viewBox="0 0 1440 56" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,28 C360,56 1080,0 1440,28 L1440,56 L0,56 Z" fill="#fff8fa"/>
      </svg>
    </div>
  </div>

  <!-- ░░ BRAND-LEVEL FACTS ░░ -->
  <div class="product-info">
    <div class="product-info-card">
      <span class="pil"><span class="icon">🍫</span> Eggless Brownie Cakes</span>
      <span class="pil"><span class="icon">🌾</span> No Maida</span>
      <span class="pil"><span class="icon">✨</span> Made fresh to order</span>
    </div>
  </div>

  <!-- ░░ SECTIONS (filled in by js/app.js) ░░ -->
  <main class="content">
    <div id="deliverySlot"></div>

    <div id="packagingSlot"></div>

    <div id="hamperSlot"></div>

    <div class="section-block">
      <div class="section-head">
        <h2>Our Brownie Boxes</h2>
        <div class="section-divider"><span>✦</span></div>
        <p>Four sizes, same recipe — pick what fits the occasion.</p>
      </div>
      <div class="tier-list" id="tierSlot"></div>
    </div>

    <div id="addOnsSlot"></div>

    <div id="reviewsSlot"></div>
  </main>

  <!-- ░░ FOOTER WAVE ░░ -->
  <div class="footer-wave">
    <svg viewBox="0 0 1440 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,20 C480,40 960,0 1440,20 L1440,40 L0,40 Z" fill="#ffe0eb"/>
    </svg>
  </div>
  <footer>
    <div>Made with <span class="heart">♥</span> just for you</div>
    <div class="brand" id="footerBrand"></div>
  </footer>

  <!-- ░░ TAP TOAST ░░ -->
  <div class="tap-toast" id="tapToast">
    <span class="t-icon">👆</span> Tap any photo to view it full size
  </div>

  <!-- ░░ LIGHTBOX ░░ -->
  <div class="lightbox" id="lb">
    <div class="lb-topbar">
      <div class="lb-category" id="lb-cat"></div>
      <div class="lb-counter"  id="lb-cnt"></div>
      <div class="lb-close-btn" id="lb-close">✕</div>
    </div>
    <div class="lb-row">
      <div class="lb-arrow" id="lb-prev">&#8592;</div>
      <div class="lb-img-wrap">
        <div class="lb-loader" id="lb-loader"></div>
        <img id="lb-img" src="" alt="">
      </div>
      <div class="lb-arrow" id="lb-next">&#8594;</div>
    </div>
    <div class="lb-dots" id="lb-dots"></div>
  </div>

  <!-- ░░ FLOATING ORDER CTA ░░ (href/label filled in by js/app.js) -->
  <a href="#" class="floating-cta" id="floatingCta" target="_blank" rel="noopener" aria-label="Order now">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3C7.03 3 3 6.58 3 11c0 2.39 1.19 4.53 3.08 5.98-.1.9-.5 2.15-1.58 3.52 1.7-.16 3.13-.82 4.24-1.6.96.27 2.01.42 3.26.42 4.97 0 9-3.58 9-8s-4.03-8-9-8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>
    <span class="floating-cta-text" id="floatingCtaLabel"></span>
  </a>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
